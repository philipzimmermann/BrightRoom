name: CI

on:
  push:
    branches: 
      - dev
      - add_ci
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libqt6widgets6 \
            qt6-base-dev \
            libjpeg-dev \
            libopencv-dev \
            ninja-build

      - name: Fetch Halide
        run: |
          chmod +x scripts/fetch_halide.sh
          ./scripts/fetch_halide.sh

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build
            thirdparty/halide
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Configure CMake
        run: |
          mkdir -p build/Release
          cd build/Release
          cmake ../.. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: |
          cd build/Release
          cmake --build . --config Release

      - name: Collect shared libraries
        run: |
          mkdir -p build/Release/artifacts
          cp build/Release/brightroom build/Release/artifacts/
          # Copy LibRaw shared libraries (both files and follow symlinks)
          find build/Release/submodules/thirdparty/LibRaw-cmake -name "*.so*" -exec cp -L {} build/Release/artifacts/ \;
          echo "Artifacts collected:"
          ls -lh build/Release/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brightroom-linux
          path: build/Release/artifacts/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: 'true'

      - name: Install Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true

      - name: Fetch Halide
        shell: pwsh
        run: |
          ./scripts/fetch_halide.ps1

      - name: Configure CMake
        shell: pwsh
        run: |
          $Qt6_DIR = "$env:Qt6_DIR"
          $vcpkgRoot = "$env:VCPKG_ROOT"
          mkdir -p build/Release
          cd build/Release
          cmake ../.. `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `

      - name: Build
        shell: pwsh
        run: |
          cd build/Release
          cmake --build . --config Release

      - name: Find executable
        shell: pwsh
        id: find-exe
        run: |
          # Try common locations for the executable
          $possiblePaths = @(
            "build/Release/brightroom.exe",
            "build/Release/Release/brightroom.exe",
            "build/Release/Debug/brightroom.exe"
          )
          
          $exe = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $exe = Resolve-Path $path
              break
            }
          }
          
          # If not found in common locations, search recursively
          if (-not $exe) {
            $exe = Get-ChildItem -Path "build/Release" -Filter "brightroom.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) {
              $exe = $exe.FullName
            }
          } else {
            $exe = $exe.Path
          }
          
          if ($exe) {
            Write-Host "Found executable at: $exe"
            echo "path=$exe" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Executable not found, listing build directory:"
            Get-ChildItem -Path "build/Release" -Recurse | Select-Object FullName
            exit 1
          }

      - name: Collect DLLs and executable
        shell: pwsh
        id: collect-dlls
        run: |
          $exePath = "${{ steps.find-exe.outputs.path }}"
          $exeDir = Split-Path -Parent $exePath
          $artifactsDir = "build/Release/artifacts"
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null
          
          # Copy executable
          Copy-Item $exePath -Destination $artifactsDir
          
          # Copy all DLLs from the executable directory
          Get-ChildItem -Path $exeDir -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $artifactsDir
            Write-Host "Copied DLL: $($_.Name)"
          }
          
          # Also check LibRaw-cmake directory for DLLs
          $librawDllPath = "build/Release/submodules/thirdparty/LibRaw-cmake/raw.dll"
          if (Test-Path $librawDllPath) {
            Copy-Item $librawDllPath -Destination $artifactsDir
            Write-Host "Copied LibRaw DLL: raw.dll"
          }
          
          Write-Host "Artifacts collected:"
          Get-ChildItem -Path $artifactsDir | Select-Object Name, Length
          echo "artifactsDir=$artifactsDir" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brightroom-windows
          path: ${{ steps.collect-dlls.outputs.artifactsDir }}/*
          if-no-files-found: error

