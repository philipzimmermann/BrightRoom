name: CI

on:
  push:
    branches: 
      - dev
      - add_ci
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libqt6widgets6 \
            qt6-base-dev \
            libjpeg-dev \
            libopencv-dev \
            ninja-build

      - name: Fetch Halide
        run: |
          chmod +x scripts/fetch_halide.sh
          ./scripts/fetch_halide.sh

      - name: Configure CMake
        run: |
          mkdir -p build/Release
          cd build/Release
          cmake ../.. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: |
          cd build/Release
          cmake --build . --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brightroom-linux
          path: build/Release/brightroom
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          modules: 'qtbase'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Install vcpkg
        uses: microsoft/setup-vcpkg@v3

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install opencv jpeg-turbo --triplet x64-windows

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest

      - name: Fetch Halide
        shell: pwsh
        run: |
          ./scripts/fetch_halide.ps1

      - name: Configure CMake
        shell: pwsh
        run: |
          $Qt6_DIR = "$env:Qt6_DIR"
          $vcpkgRoot = "$env:VCPKG_ROOT"
          mkdir -p build/Release
          cd build/Release
          cmake ../.. `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: |
          cd build/Release
          cmake --build . --config Release

      - name: Find executable
        shell: pwsh
        id: find-exe
        run: |
          # Try common locations for the executable
          $possiblePaths = @(
            "build/Release/brightroom.exe",
            "build/Release/Release/brightroom.exe",
            "build/Release/Debug/brightroom.exe"
          )
          
          $exe = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $exe = Resolve-Path $path
              break
            }
          }
          
          # If not found in common locations, search recursively
          if (-not $exe) {
            $exe = Get-ChildItem -Path "build/Release" -Filter "brightroom.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) {
              $exe = $exe.FullName
            }
          } else {
            $exe = $exe.Path
          }
          
          if ($exe) {
            Write-Host "Found executable at: $exe"
            echo "path=$exe" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Executable not found, listing build directory:"
            Get-ChildItem -Path "build/Release" -Recurse | Select-Object FullName
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brightroom-windows
          path: ${{ steps.find-exe.outputs.path }}
          if-no-files-found: error

